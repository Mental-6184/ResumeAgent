spring:
  application:
    name: resume-agent

resumeagent:
  openai:
    base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_MODEL:GLM-4-Flash-250414}
    temperature: 0.7
    max-tokens: 2048
    top-p: 0.9
  security:
    block-on-injection: true
    redact-sensitive: true
  audit:
    enabled: true

server:
  port: 8080
